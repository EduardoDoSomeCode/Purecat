name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create embedded Python environment
        shell: pwsh
        run: |
          python -m venv python_env
          .\python_env\Scripts\pip.exe install --upgrade pip
          .\python_env\Scripts\pip.exe install auto-editor faster-whisper

      - name: Install Node dependencies
        run: npm install

      - name: Build Windows executable
        run: npm run build:win -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: purecat-windows
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: warn
